version: 2
jobs:
  build:
    docker:
      - image: debian:stretch

    steps:
      - checkout

      - run:
          name: install sudo
          command: 'apt update && apt install -y sudo && rm -rf /var/lib/at/lists*'
      - run:
          name: install gcc
          command: 'sudo apt update && sudo apt install -y gcc g++'
      - run:
          name: install cmake
          command: 'sudo apt update && sudo apt install -y cmake'
      - run:
          name: install rust
          command: 'sudo apt update && sudo apt install -y curl && curl https://sh.rustup.rs -sSf | sh -s -- -y && export PATH=$PATH:~/.cargo/bin'
      - run:
          name: library test
          command: './utils/run_test/run_test.sh'
